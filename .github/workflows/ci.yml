# Everything `make check` runs, in parallel jobs. Also called by release.yml before a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recorder:
    name: Recorder (lint, types, tests, coverage, catalog, public-data scan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: make setup
      - run: make public-check lint typecheck coverage catalog-check

  database:
    name: Database (migrations, RLS, pgTAP) and cloud integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: make setup
      - name: Recorder against the local stack
        run: uv --directory recorder run pytest tests/cloud -q

  app:
    name: Flutter app (analyze, tests, goldens, coverage)
    # Golden images are rendered on macOS; Linux font rendering differs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          cache: true
      - run: cd app && flutter pub get
      - run: make app-check

  web:
    name: Website and setup wizard (build, unit, Playwright, axe, tokens)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make tokens-check
      - run: cd web && npm ci --no-audit --no-fund
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx ng build setup && npm run build:site
      - run: cd web && npx ng test setup --watch=false --browsers=ChromeHeadlessCI
      - run: cd web && npx ng test site --watch=false --browsers=ChromeHeadlessCI
      - run: cd web && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
